# =====================================================================
# PERFIL DE DESARROLLO (dev) - H2 EN MEMORIA Y MAXIMA OBSERVABILIDAD
# =====================================================================

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate en desarrollo: regeneración automática y trazas SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging: Nivel detallado DEBUG para com.universidad
logging.level.root=INFO
logging.level.com.universidad=DEBUG

# Spring Boot Actuator en dev: Exposición total para depuración local
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
