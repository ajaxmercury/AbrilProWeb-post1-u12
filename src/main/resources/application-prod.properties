# =====================================================================
# PERFIL DE PRODUCCION (prod) - POSTGRESQL EXTERNO Y SEGURIDAD REFORZADA
# =====================================================================

# Conexión a base de datos persistente mediante variables de entorno (CERO credenciales en claro)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/proddb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate en producción: Solo validación de esquema sin impacto en DDL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging: Nivel restringido para producción (Cero ruido y alta eficiencia)
logging.level.root=WARN
logging.level.com.universidad=INFO

# Spring Boot Actuator en producción: Mínima superficie de ataque
# Solo health e info expuestos; show-details restringido; endpoints sensibles dan 404
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=false
