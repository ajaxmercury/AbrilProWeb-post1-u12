# =====================================================================
# CONFIGURACION PRINCIPAL (BASE) - PLACEHOLDERS Y SEPARACION DE PERFILES
# =====================================================================

# Nombre de la aplicación
spring.application.name=mi-spring-app

# Puerto del servidor web con fallback por defecto a 8080 (Compatible con PaaS como Railway/Render que inyectan $PORT)
server.port=${PORT:8080}

# Perfil activo externalizado con fallback seguro al entorno local de desarrollo (dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
